<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapas y Actividades - Posada J</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f9; 
            color: #333; 
            padding: 20px; 
            margin: 0;
        }
        h1 { color: #2c3e50; }
        .map-container { 
            margin: 20px auto; 
            padding: 15px; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            max-width: 600px; 
        }
        img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 5px; 
        }
        .whatsapp-btn {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        .whatsapp-btn:hover { background-color: #1ebe5d; }
    </style>
</head>
<body>
    <h1>Rutas y Actividades en Baños</h1>
    <p>Explora nuestras recomendaciones para tu aventura.</p>

    <!-- Pon aquí tu número real en lugar de los XXXXXXXXX -->
    <a href="https://wa.me/593XXXXXXXXX" class="whatsapp-btn" target="_blank">
        💬 Contactar por WhatsApp
    </a>

    <div class="map-container">
        <h2>Mapa de la Ciudad</h2>
        <img src="mapa-banos.jpg" alt="Mapa de la ciudad de Baños">
    </div>

    <div class="map-container">
        <h2>Ruta de las Cascadas</h2>
        <img src="ruta-cascadas.jpg" alt="Mapa de la Ruta de las Cascadas">
    </div>

</body>
</html>
