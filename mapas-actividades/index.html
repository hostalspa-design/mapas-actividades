<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapas Turísticos de Baños</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f7f4;
      color: #234238;
      text-align: center;
    }
    header {
      background: #16775f;
      color: white;
      padding: 25px 15px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 20px 15px;
    }
    .mapa {
      background: white;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0002;
    }
    .mapa img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    .boton {
      display: inline-block;
      background: #16775f;
      color: white;
      padding: 12px 22px;
      margin-top: 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    footer {
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <h1>Baños de Agua Santa</h1>
  <p>Mapas turísticos y Ruta de las Cascadas</p>
</header>

<main>

  <section class="mapa">
    <h2>Ruta de las Cascadas</h2>
    <a href="ruta-de-las-cascadas">
      <img src="ruta-de-las-cascadas"
           alt="Mapa de la Ruta de las Cascadas">
    </a>
    <a class="boton"
       href="ruta-de-las-cascadas"
       target="_blank">
      Ver mapa completo
    </a>
  </section>

  <section class="mapa">
    <h2>Mapa de Baños</h2>
    <a href="mapa-de-banos">
      <img src="mapa-de-banos"
           alt="Mapa turístico de Baños">
    </a>
    <a class="boton"
       href="mapa-de-banos"
       target="_blank">
      Ver mapa completo
    </a>
  </section>

</main>

<footer>
  Baños de Agua Santa - Ecuador
</footer>

</body>
</html>
